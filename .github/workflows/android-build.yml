name: Android Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build and sign release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="$RUNNER_TEMP/linux-deploy-release.apk"
          APK_SIGNER="$ANDROID_HOME/build-tools/29.0.2/apksigner"

          "$APK_SIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias androiddebugkey \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          "$APK_SIGNER" verify "$SIGNED_APK"
          echo "RELEASE_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deploy-release
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="master-${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Master build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated signed build from commit ${GITHUB_SHA}." \
            --prerelease
